name: sync-upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: caph
          fetch-depth: 0

      - name: Rebase caph onto upstream main
        run: |
          set -euo pipefail
          git config user.name "pi-search sync bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git remote add upstream https://github.com/justhil/pi-search.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "already contains upstream/main; nothing to do"
            exit 0
          fi
          git rebase upstream/main
          git log --oneline -3

      - name: Push rebased branch
        run: |
          set -euo pipefail
          if [ -z "$(git log origin/caph..HEAD --oneline)" ] && git merge-base --is-ancestor HEAD origin/caph; then
            echo "nothing to push"
            exit 0
          fi
          git push --force-with-lease origin caph
